name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install WTL headers
        shell: pwsh
        run: |
          $nuget = "$env:TEMP\nuget.exe"
          Invoke-WebRequest "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile $nuget -UseBasicParsing
          & $nuget install WTL -OutputDirectory "$env:TEMP\wtl_pkg" -NonInteractive | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath  = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $msvcDir = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1
          $atlmfcInclude = "$($msvcDir.FullName)\atlmfc\include"
          $wtlPkg = (Get-ChildItem "$env:TEMP\wtl_pkg" -Directory | Select-Object -First 1).FullName
          Copy-Item "$wtlPkg\lib\native\include\*" -Destination $atlmfcInclude -Force

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        shell: pwsh
        run: |
          msbuild foo_rg_bump.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            /m /v:m /nologo

      - name: Build Release x86
        shell: pwsh
        run: |
          msbuild foo_rg_bump.sln `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            /p:PlatformToolset=v143 `
            /m /v:m /nologo

      - name: Package .fb2k-component
        shell: pwsh
        run: |
          # A .fb2k-component is a zip containing:
          #   foo_rg_bump.dll        (x86, for foobar2000 < 2.0 or 32-bit installs)
          #   x64\foo_rg_bump.dll   (x64, for foobar2000 2.0+)
          $dist = "dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          New-Item -ItemType Directory -Force "$dist\x64" | Out-Null
          Copy-Item "Win32\Release\foo_rg_bump.dll" "$dist\foo_rg_bump.dll"
          Copy-Item "x64\Release\foo_rg_bump.dll"   "$dist\x64\foo_rg_bump.dll"
          Compress-Archive -Path "$dist\*" -DestinationPath "foo_rg_bump.fb2k-component" -Force

      - name: Upload x64 DLL
        uses: actions/upload-artifact@v4
        with:
          name: foo_rg_bump-x64
          path: x64\Release\foo_rg_bump.dll

      - name: Upload x86 DLL
        uses: actions/upload-artifact@v4
        with:
          name: foo_rg_bump-x86
          path: Win32\Release\foo_rg_bump.dll

      - name: Upload .fb2k-component
        uses: actions/upload-artifact@v4
        with:
          name: foo_rg_bump-component
          path: foo_rg_bump.fb2k-component
