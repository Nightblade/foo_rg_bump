name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ATL
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe" modify `
            --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" `
            --add Microsoft.VisualStudio.Component.VC.14.29.16.11.ATL `
            --quiet --norestart --force

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        shell: pwsh
        run: |
          msbuild foo_rg_bump.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            /m /v:m /nologo

      - name: Build Release x86
        shell: pwsh
        run: |
          msbuild foo_rg_bump.sln `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            /p:PlatformToolset=v143 `
            /m /v:m /nologo

      - name: Package .fb2k-component
        shell: pwsh
        run: |
          # A .fb2k-component is a zip containing:
          #   foo_rg_bump.dll        (x86, for foobar2000 < 2.0 or 32-bit installs)
          #   x64\foo_rg_bump.dll   (x64, for foobar2000 2.0+)
          $dist = "dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          New-Item -ItemType Directory -Force "$dist\x64" | Out-Null
          Copy-Item "Win32\Release\foo_rg_bump.dll" "$dist\foo_rg_bump.dll"
          Copy-Item "x64\Release\foo_rg_bump.dll"   "$dist\x64\foo_rg_bump.dll"
          Compress-Archive -Path "$dist\*" -DestinationPath "foo_rg_bump.fb2k-component" -Force

      - name: Upload x64 DLL
        uses: actions/upload-artifact@v4
        with:
          name: foo_rg_bump-x64
          path: x64\Release\foo_rg_bump.dll

      - name: Upload x86 DLL
        uses: actions/upload-artifact@v4
        with:
          name: foo_rg_bump-x86
          path: Win32\Release\foo_rg_bump.dll

      - name: Upload .fb2k-component
        uses: actions/upload-artifact@v4
        with:
          name: foo_rg_bump-component
          path: foo_rg_bump.fb2k-component
